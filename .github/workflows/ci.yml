name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Synthetic, non-secret values only. No real API keys in CI: evals use recorded fixtures.
  SESSION_SECRET: ci-only-session-secret-ci-only-session-secret
  REFILL_LIMIT: "2"
  SAMPLE_RATE: "0.2"
  SEED: "42"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  unit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careloop
          POSTGRES_PASSWORD: careloop
          POSTGRES_DB: careloop
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U careloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://careloop:careloop@localhost:54329/careloop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Recorded LLM responses (evals/fixtures); never calls the live API in CI.
      - run: pnpm eval

  e2e:
    runs-on: ubuntu-latest
    needs: [typecheck, lint, unit, eval]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careloop
          POSTGRES_PASSWORD: careloop
          POSTGRES_DB: careloop
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U careloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The e2e suite refuses to reset any database whose name does not end in _e2e. It creates,
      # migrates and seeds this database itself, so no separate migrate or seed step is needed.
      DATABASE_URL: postgres://careloop:careloop@localhost:54329/careloop_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
