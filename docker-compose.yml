services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: careloop
      POSTGRES_PASSWORD: careloop
      POSTGRES_DB: careloop
    ports:
      - "54329:5432"
    volumes:
      - careloop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careloop"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  careloop-pg:
